name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run type check
        run: bun run typecheck

      - name: Test monthly-update reminder links
        run: bun test tests/monthly-update-reminder-link.test.ts

      - name: Test homepage donation modal
        run: bun test tests/donation-modal.test.ts

      - name: Test Roo account-link security
        run: |
          bun test \
            tests/roo-account-link.test.ts \
            tests/roo-account-link-route.test.ts \
            tests/roo-account-link-worker.test.ts \
            tests/session-refresh.test.ts

      - name: Build project
        run: bun run build
