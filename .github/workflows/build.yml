name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Test monthly-update reminder links
        run: bun test tests/monthly-update-reminder-link.test.ts

      - name: Test homepage donation modal
        run: bun test tests/donation-modal.test.ts

      - name: Test app privacy and support disclosures
        run: bun test tests/ccc-app-review-privacy.test.ts

      - name: Test Roo account-link security
        run: |
          bun test \
            tests/roo-account-link.test.ts \
            tests/roo-account-link-route.test.ts \
            tests/roo-account-link-worker.test.ts

      - name: Test monthly update contracts
        run: bun test tests/monthly-update-evidence.test.tsx tests/monthly-update-reminder-link.test.ts tests/vibe-raising-*.test.*

      - name: Build project
        run: bun run build

      - name: Install browser for article delivery checks
        run: bunx playwright install --with-deps chromium

      - name: Check article delivery and keyboard controls
        run: bun run test:articles:browser
