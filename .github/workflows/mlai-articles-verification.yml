name: MLAI native articles verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Build baseline and verify article routes
        run: python .mlai/articles-verification.py verify
      - name: Seal provider-authenticated native evidence
        if: github.event_name != 'pull_request'
        run: python .mlai/articles-verification.py seal
        env:
          MLAI_SEAL_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: mlai-native-evidence
          path: |
            mlai-native-evidence.json
            mlai-provider-receipt.json
